<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0d1118" />
    <title>Sistema 3 Dimensões · Visualizador</title>
  </head>
  <body class="viewer-body">
    <div id="viewer-root">
      <canvas id="scene-canvas" aria-label="Visualização tridimensional do mapa"></canvas>
      <header class="viewer-topbar">
        <div class="viewer-brand">
          <span class="mini-mark" aria-hidden="true">3D</span>
          <div><strong>Sistema 3 Dimensões</strong><small id="scene-status">Preparando cena…</small></div>
        </div>
        <div class="top-actions">
          <button class="tool-button" id="view-iso" type="button" title="Vista isométrica">Isométrica</button>
          <button class="tool-button" id="view-top" type="button" title="Vista superior">Superior</button>
          <button class="tool-button" id="camera-reset" type="button" title="Centralizar câmera">Centralizar</button>
          <button class="close-button" id="close-viewer" type="button" title="Fechar modo 3D" aria-label="Fechar modo 3D">×</button>
        </div>
      </header>
      <section id="token-toolbar" class="token-toolbar" hidden aria-label="Ações dos tokens selecionados">
        <div class="token-toolbar-heading">
          <strong id="selection-label">Token selecionado</strong>
          <button class="token-action subtle-action" id="deselect-tokens" type="button" title="Limpar seleção">Limpar</button>
        </div>
        <div class="token-toolbar-actions">
          <button class="token-action" id="scale-token-down" type="button" title="Diminuir tamanho dos tokens em 10%">− 10%</button>
          <button class="token-action" id="scale-token-up" type="button" title="Aumentar tamanho dos tokens em 10%">+ 10%</button>
          <button class="token-action" id="rotate-token-left" type="button" title="Girar selecionados 15 graus para a esquerda">↶ 15°</button>
          <button class="token-action" id="rotate-token-right" type="button" title="Girar selecionados 15 graus para a direita">↷ 15°</button>
          <button class="token-action" id="toggle-token-lock" type="button" title="Bloquear ou desbloquear tokens">Bloquear</button>
          <button class="token-action" id="toggle-token-visibility" type="button" title="Ocultar ou mostrar tokens">Ocultar</button>
          <button class="token-action danger-action" id="delete-selected-tokens" type="button" title="Excluir tokens selecionados">Excluir</button>
        </div>
      </section>
      <div class="viewer-bottom-left">
        <span class="legend-dot map-dot"></span><span id="map-count">0 mapas</span>
        <span class="legend-dot token-dot"></span><span id="token-count">0 miniaturas</span>
        <span class="legend-dot prop-dot"></span><span id="prop-count">0 objetos</span>
      </div>
      <div class="viewer-help"><kbd>Toque e arraste</kbd> uma miniatura para movê-la · <kbd>Shift</kbd> seleção múltipla · <kbd>Botão direito</kbd> girar câmera</div>
      <div id="message-panel" class="message-panel" hidden role="alert">
        <div class="message-symbol" id="message-symbol">!</div>
        <h2 id="message-title">Aguardando cena</h2>
        <p id="message-body">Carregando dados da sala.</p>
        <button id="message-retry" class="secondary-button" type="button">Tentar novamente</button>
      </div>
      <div id="toast" class="toast" role="status" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/viewer.ts"></script>
  </body>
</html>
